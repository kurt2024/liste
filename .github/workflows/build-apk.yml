name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Al
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Kütüphaneleri Yükle
        run: npm install

      - name: Web Klasörünü Hazırla
        run: |
          mkdir www
          cp index.html www/
          cp manifest.json www/
          cp icon.svg www/

      - name: Java Kurulumu (Android için)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Capacitor ile Android Projesi Oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: APK Derleme İşlemi (Gradle)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını Yükle (İndirme Linki Oluştur)
        uses: actions/upload-artifact@v4
        with:
          name: Nobet-Dagitim-App.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
